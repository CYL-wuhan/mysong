<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="680" height="440" fill="#f7f7fb"/>
  <rect x="0" y="0" width="680" height="44" fill="#ececf3"/>
  <rect x="16" y="12" width="420" height="20" rx="10" fill="#fff" stroke="#d9d9e3"/>
  <text x="30" y="26" font-size="13" fill="#5a5a72">github.com/new</text>
  <rect x="24" y="68" width="632" height="348" rx="14" fill="#fff" stroke="#e3e3ee"/>
  <text x="48" y="104" font-size="20" font-weight="700" fill="#1a1a2e">Create a new repository</text>
  <line x1="48" y1="120" x2="632" y2="120" stroke="#eee"/>
  <text x="48" y="152" font-size="14" fill="#5a5a72">Repository name（仓库名）</text>
  <rect x="48" y="164" width="420" height="34" rx="8" fill="#fff" stroke="#d9d9e3"/>
  <text x="62" y="186" font-size="13" fill="#1a1a2e">chenyile-portfolio</text>
  <text x="48" y="232" font-size="14" fill="#5a5a72">Visibility（可见性）</text>
  <rect x="48" y="244" width="16" height="16" rx="4" fill="#6d5dfc"/>
  <text x="74" y="257" font-size="13" fill="#1a1a2e">Public（必须选 Public，才能免费部署）</text>
  <rect x="48" y="312" width="190" height="40" rx="8" fill="#2ea043"/>
  <text x="143" y="337" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Create repository</text>
  <text x="48" y="386" font-size="12" fill="#8a8a9a">建好后，把项目文件夹里的所有文件上传进去（Web 直接拖，或用 Git 命令，见文档方法 B）。</text>
</svg>
