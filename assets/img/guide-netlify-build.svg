  <rect x="24" y="104" width="632" height="332" rx="14" fill="#fff" stroke="#e3e3ee"/>
  <text x="48" y="138" font-size="14" fill="#5a5a72">1) Connect to Git provider：选 <tspan fill="#1a1a2e" font-weight="700">GitHub</tspan></text>
